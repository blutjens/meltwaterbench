# sample config for linear_dem. 
#  All tifs in train, val, test, eval.csv are the same, because the linear_dem
#  cannot extrapolate across months.

# Common parameters are described in runs/unet/data_v1_4/config/config.yaml or runs/linear_dem/sample/config/config.yaml

# environment/computational parameters
seed: 42
device: 'gpu' # cpu or gpu -> linear model trains slightly faster on CPU than GPU, but evaluates faster on GPU
num_workers: 1
use_deterministic_algorithms: True
warn_only: True

# debugging and logging
verbose: True
log_weight_histograms: False
path_experiment: './runs/linear_dem/sample'
path_wandb: './runs/linear_dem/sample'
path_checkpoints: './runs/linear_dem/sample/checkpoints'
path_sweep: './runs/linear_dem/sample/sweep'
path_sweep_cfg: './runs/linear_dem/sample/config/sweep.yaml'
path_predictions: './runs/linear_dem/sample/predictions'
path_predictions_linear_dem: './runs/linear_dem/sample/predictions'
path_eval: './runs/linear_dem/sample/eval_during_training'
wandb_entity: null
wandb_project_name: 'hrmelt-linear_dem-sample'
model_key: 'linear_dem'
data_key: 'sample'

# wandb logging
wandb_entity: 'blutjens'
wandb_project_name: 'hrmelt-linear_dem-sample'
add_wandb_id_to_ckpt_filename: False
period_wandb_full_scale_im: 1
log_inputs_and_targets_to_wandb: True

# dataset parameters
data_root: 'data/'
filetype: '.tif'
split_cfg: 'csv'
create_csv_w_split_cfg: False
path_train_split_csv: './runs/linear_dem/sample/config/train.csv'
path_val_split_csv: './runs/linear_dem/sample/config/val.csv'
path_test_split_csv: './runs/linear_dem/sample/config/test.csv' 
path_eval_split_csv: './runs/linear_dem/sample/config/eval.csv'
in_keys: []
in_keys_static: ['dem']
in_keys_aux: ['time_month_idx']
# Paths to data variables; relative to data_root
path_time_interpolate_sar: 'interim/runs/time_interpolate_sar/sample/predictions/'
path_pmw: 'raw/Helheim_data/sample/PMW/'
path_modis_b1: 'raw/Helheim_data/sample/MODIS/MOD09GA_b01/'
path_modis_b2: 'raw/Helheim_data/sample/MODIS/MOD09GA_b02/'
path_mar_wa1: 'raw/Helheim_data/sample/MAR/MARv3.12/WA1/'
path_melt: 'raw/Helheim_data/sample/SAR/S1X/HH_PercentMelt/'
path_melt_reference: 'raw/Helheim_data/sample/SAR/S1X/HH_PercentMelt/2018_09_10.tif'
# Paths to static variables
path_landmask: 'raw/Helheim_data/sample/GIMP_Mask/landMask_100m.tif'
path_dem: 'raw/Helheim_data/sample/GrIMP_DEM/dem_100m.tif'
mean_pmw: 206.1035919189453
mean_modis_b1: 0.6493049127465401
mean_modis_b2: 0.5751748354933877
mean_mar_wa1: 0.005986050236970186
mean_melt: 0.1931522637605667
mean_dem: 1175.09423828125
std_pmw: 26.77197265625
std_modis_b1: 0.3393826722741524
std_modis_b2: 0.30517456763241924
std_mar_wa1: 0.008952183648943901
std_melt: 0.3040434420108795
std_dem: 993.8522338867188
nodata_modis: -999
max_modis: 10000
max_mar_wa1: 1.
min_melt: 0.
max_melt: 1.

# Data transformation and augmentation parameters
use_batch_blur: False
pmw_GaussianBlur_kernel_size: 45.
pmw_GaussianBlur_sigma: 15.
mar_wa1_GaussianBlur_kernel_size: 99.
mar_wa1_GaussianBlur_sigma: 33.

dtype: 'float32'
amp: False
persistent_workers: True

# model hyperparameters
n_models: 12 # Number of separate linear regression models to train (12: one per month)
time_channel_idx: 1 # Index of the time channel in the input tensor

# training hyperparameters
epochs: 31
batch_size: 16
img_size: [2863, 1633]
val_percent: 0.11
test_percent: 0.11
optimizer: 'adam'
weight_decay: 0.
loss_function: 'mse'
out_activation: 'sigmoidcutoff' # linear_dem supports 'tanhshelf', 'sigmoidcutoff', 'sigmoid'
activation: 'linear'
out_channels: 1

### Learning rate
learning_rate: 1.
# Step learning rate scheduler 
lr_scheduler: 'ReduceLROnPlateau'
lr_patience: 3

# CosineAnnealingWarmRestarts lerning rate scheduler config
# lr_scheduler: 'CosineAnnealingWarmRestarts'
T_0: 35
T_mult: 2
eta_min: 0.

periodical_evaluation: True
periodical_evaluation_include_ssim: True
epochs_between_periodical_evaluation: 2
starting_epoch: 1

# Evaluation parameters
prediction_batch_size: 1
prediction_stride: null
erode_size: 0
apply_landmask_to_predictions: False